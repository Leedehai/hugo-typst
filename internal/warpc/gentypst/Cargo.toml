[package]
name = "gentypst"
version = "0.15.0"
edition = "2024"

[[bin]]
name = "typst"
path = "src/main.rs"

[dependencies]
ecow = { version = "0.2.6", features = ["serde"] }
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
typst = "0.15.0"
typst-html = "0.15.0"
typst-kit = { version = "0.15.0", features = ["datetime", "emit-diagnostics"] }
typst-library = "0.15.0"
typst-utils = "0.15.0"

[profile.release]
strip = true
opt-level = "z"
codegen-units = 1
lto = "thin"
